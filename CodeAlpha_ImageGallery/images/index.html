<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive image gallery with category filters and a lightbox viewer.">
  <title>Lumen Gallery | CodeAlpha Internship</title>

  <!-- Fonts (falls back to system fonts if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Lumen Gallery</h1>
    <p class="site-tagline">Lumen means light. A collection of photos worth a closer look. Pick a category, then tap any photo to open it full screen.</p>
  </header>

  <section class="toolbar" aria-label="Gallery controls">
    <!-- Filter buttons are created by script.js -->
    <div id="filters" class="filters" role="group" aria-label="Filter photos by category"></div>
    <p id="result-count" class="result-count" aria-live="polite"></p>
  </section>

  <main>
    <!-- Photo cards are created by script.js -->
    <ul id="gallery" class="gallery"></ul>
  </main>

  <footer class="site-footer">
    <p>Built with HTML, CSS and vanilla JavaScript for the CodeAlpha Frontend Internship.</p>
  </footer>

  <!-- Lightbox viewer -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <button type="button" id="lb-close" class="lb-btn lb-close" aria-label="Close viewer">&times;</button>
    <button type="button" id="lb-prev" class="lb-btn lb-prev" aria-label="Previous photo">&#8249;</button>

    <figure class="lb-figure">
      <img id="lb-img" class="lb-img" src="" alt="">
      <figcaption class="lb-caption">
        <span id="lb-title" class="lb-title"></span>
        <span id="lb-counter" class="lb-counter"></span>
      </figcaption>
    </figure>

    <button type="button" id="lb-next" class="lb-btn lb-next" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
